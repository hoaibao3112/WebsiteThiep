name: Backend CI & Quality Gate

on:
  push:
    branches:
      - "**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-checks:
    name: Backend Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: cardvite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: be/package-lock.json

      - name: Install Dependencies
        working-directory: be
        run: npm ci

      - name: Generate Prisma Client
        working-directory: be
        run: npm run prisma:generate

      - name: TypeScript Static Typecheck
        working-directory: be
        run: npx tsc --noEmit --incremental false

      - name: Run Unit Tests
        working-directory: be
        run: npm test

      - name: Run Integration Tests
        working-directory: be
        env:
          TEST_DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/cardvite_test?schema=public
          TEST_REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret-min32chars-for-unit-testing
        run: npm run test:integration

      - name: Verify Production Build
        working-directory: be
        run: npm run build
